name: Build n8n-nodes-ip-ranges-csp

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: 'npm ci'
        working-directory: ./n8n-nodes-ip-ranges-csp

      - name: Run lint
        run: 'npm run lint'
        working-directory: ./n8n-nodes-ip-ranges-csp

      - name: Run build
        run: 'npm run build'
        working-directory: ./n8n-nodes-ip-ranges-csp
