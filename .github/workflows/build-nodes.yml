name: Build custom n8n nodes

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: 'npm ci'
        working-directory: ./n8n-nodes

      - name: Run lint
        run: 'npm run lint'
        working-directory: ./n8n-nodes

      - name: Run prettier
        run: 'npm run format'
        working-directory: ./n8n-nodes

      - name: Run build
        run: 'npm run build'
        working-directory: ./n8n-nodes
