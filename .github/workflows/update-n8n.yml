name: Update n8n version

# This workflow requires the following setting to be true:
# Settings -> Actions -> Workflow permissions: "Allow GitHub Actions to create and approve pull requests"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    name: Check for n8n updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch latest n8n release
        id: fetch
        uses: actions/github-script@v8
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "n8n-io",
              repo: "n8n"
            });

            // Extract version from tag (e.g. "n8n@1.120.4")
            const match = release.tag_name.match(/\d+\.\d+\.\d+/);
            if (!match?.[0]) {
              core.setFailed(`Could not extract version from tag: ${release.tag_name}`);
              return;
            }
            core.setOutput("tag", match[0]);

      - name: Read current version from Dockerfile
        id: current
        run: |
          CURRENT=$(grep -oP 'ARG N8N_VERSION=\K[0-9.]*' Dockerfile)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.fetch.outputs.tag }}" = "${{ steps.current.outputs.current }}" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          sed -i "s/ARG N8N_VERSION=.*/ARG N8N_VERSION=${{ steps.fetch.outputs.tag }}/" Dockerfile

      - name: Create or update PR
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "build: Update n8n to ${{ steps.fetch.outputs.tag }}"
          sign-commits: true
          # By having a fixed branch here, this action will always update previous PR instead of creating new ones
          branch: update-n8n
          title: "build: Update n8n to ${{ steps.fetch.outputs.tag }}"
          body: "Automated update to the latest n8n release."
          labels: auto-update
