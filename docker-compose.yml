# See: https://docs.n8n.io/hosting/installation/server-setups/docker-compose/#6-create-docker-compose-file

services:
    #  TODO Enable python task runner in external mode https://docs.n8n.io/hosting/configuration/task-runners/#setting-up-external-mode

    # See: https://doc.traefik.io/traefik/v3.0/user-guides/docker-compose/acme-tls/
    traefik:
        image: traefik:v3
        restart: unless-stopped
        command:
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.file.directory=/traefik/dynamic"

            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"

            # Let's Encrypt (tries to connect to port 443)
            - "--certificatesresolvers.le.acme.tlschallenge=true"
            - "--certificatesresolvers.le.acme.email=${SSL_EMAIL}"
            - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

        ports:
            - "80:80"
            - "443:443"

        volumes:
            - traefik_data:/letsencrypt
            - ./traefik/dynamic:/traefik/dynamic:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro

    # Note that we always need some web service running in order for the TLS challenge to work
    web:
        image: nginx:alpine
        restart: unless-stopped

        labels:
            - "traefik.enable=true"

            # Router for HTTP → HTTPS redirection
            - "traefik.http.routers.web-http.rule=Host(`${DOMAIN_NAME}`)"
            - "traefik.http.routers.web-http.entrypoints=web"
            - "traefik.http.routers.web-http.middlewares=redirect-to-https"
            - "traefik.http.routers.web-http.priority=1"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

            # Router for HTTPS
            - "traefik.http.routers.web.rule=Host(`${DOMAIN_NAME}`)"
            - "traefik.http.routers.web.entrypoints=websecure"
            - "traefik.http.routers.web.tls=true"
            - "traefik.http.routers.web.tls.certresolver=le"

            - "traefik.http.services.web.loadbalancer.server.port=80"

        volumes:
            - ./web:/usr/share/nginx/html:ro

    n8n:
        build: .
        image: cpadm:n8n
        restart: unless-stopped

        # Required by at least ZMAP
        network_mode: host
        cap_add:
            - NET_RAW
            - NET_ADMIN

        env_file:
            - .env
        environment:
            - N8N_PROTOCOL=https
            - N8N_HOST=${DOMAIN_NAME}
            - WEBHOOK_URL=https://${DOMAIN_NAME}/n8n/
            - N8N_ENDPOINT_HEALTH=n8n/healthz
            - N8N_PORT=5678
            - N8N_PATH=/n8n/
            # We run as root, not as 'node' user
            - N8N_USER_FOLDER=/home/root
            - NODE_ENV=production
            # Allow to read and write from our volume
            - N8N_RESTRICT_FILE_ACCESS_TO="/files"

        volumes:
            - n8n_data:/home/root/.n8n
            - ./data:/files


volumes:
    traefik_data:
    n8n_data:
